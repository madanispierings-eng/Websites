<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Formulieren</title></head>
<body>
<!-- Netlify leest deze statische formulieren bij de deploy; de site verstuurt ze met fetch naar dit bestand. -->
<form name="kennismaking" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="naam"><input name="email" type="email"><input name="telefoon"><input name="onderwerp"><textarea name="bericht"></textarea>
</form>
<form name="marktupdates" data-netlify="true" hidden>
  <input name="voornaam"><input name="email" type="email">
</form>
</body></html>
